{% extends "base.html" %}

{% block content %}
{% if page.date %}
<h1>{{ page.title }}</h1>
<time class="post-date" datetime="{{ page.date }}">{{ page.date | date(format="%Y-%m-%d") }}</time>
{% if page.description %}<p class="post-description">{{ page.description }}</p>{% endif %}
{% endif %}
{{ page.content | safe }}
{% endblock content %}
